
name: Build ++IA A13J0++ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IA_A13J0_Android_v0_9.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -q IA_A13J0_Android_v0_9.zip

      - name: Compilar APK
        working-directory: IA_A13J0
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: IA-A13J0-v0.9-APK
          path: IA_A13J0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
