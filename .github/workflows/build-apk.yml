
name: Build ++IA A13J0++ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IA_A13J0_Android_v0_8.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q IA_A13J0_Android_v0_8.zip

      - name: Build debug APK
        working-directory: IA_A13J0
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IA-A13J0-debug-apk
          path: IA_A13J0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
