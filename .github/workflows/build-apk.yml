
name: Build ++IA A13J0++ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IA_A13J0_Android_v1_2.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -q IA_A13J0_Android_v1_2.zip

      - name: Compilar APK
        working-directory: IA_A13J0
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IA-A13J0-v1.2-APK
          path: IA_A13J0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
